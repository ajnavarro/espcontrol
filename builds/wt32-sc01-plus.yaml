# =============================================================================
# BUILD PROFILE - Wireless-Tag WT32-SC01 PLUS (3.5" portrait)
# =============================================================================
# CI/local build entry point for the 320×480 ESP32-S3 panel.
# =============================================================================

substitutions:
  name: "espcontrol-sc01-plus"
  friendly_name: "Espcontrol WT32-SC01 PLUS"
  espcontrol_component_url: "file:///config"
  espcontrol_component_ref: "HEAD"

esphome:
  name_add_mac_suffix: true

packages:
  espcontrol: !include ../devices/wt32-sc01-plus/packages.yaml

wifi:
  ap:
    ssid: "${friendly_name}"

captive_portal:
