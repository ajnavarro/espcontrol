# =============================================================================
# FONTS (DEVICE OVERRIDE) - Sized for the 320x480 portrait display
# =============================================================================
# Supplements the common fonts with the per-device font set referenced by
# devices/manifest.json. Cell width on this 2-column 320x480 panel matches
# the 4848S040's 3-column 480x480 (~160px each), so font sizes mirror that
# device. Hebrew glyphs are pulled from gfonts://Heebo via `extras`, since
# Roboto does not include the Hebrew block.
# =============================================================================

font:
  # Button icons (44px, matches 4848S040 ~160px cell width)
  - file: 'https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf'
    id: font_mdi_44_icons
    size: 44
    bpp: 4
    glyphs: !include ../../../common/assets/icon_glyphs.yaml

  # Climate card icons (25% smaller than main page icons)
  - file: 'https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf'
    id: font_mdi_33_icons
    size: 33
    bpp: 4
    glyphs: !include ../../../common/assets/icon_glyphs.yaml

  # Climate modal mode/value text (smaller than normal button labels)
  - file: "gfonts://Roboto"
    id: font_roboto_regular_18_text
    size: 18
    bpp: 4
    glyphs: !include ../../../common/assets/text_glyphs.yaml
    extras:
      - file: "gfonts://Heebo"
        glyphs: !include ../../../common/assets/hebrew_glyphs.yaml

  # Sensor value large number (44px, matches button icon size)
  - file: "gfonts://Roboto@Light"
    id: font_roboto_light_44_digits
    size: 44
    bpp: 4
    glyphs:
      - "0123456789.-°/%"
      - ":"

  # Large-card sensor values (2.5x the regular sensor value font)
  - file: "gfonts://Roboto@Thin"
    id: font_roboto_thin_110_digits
    size: 110
    bpp: 4
    glyphs:
      - "0123456789.-°/%"
      - ":"

  # Media now-playing titles (sensor value size, full text glyph coverage)
  - file: "gfonts://Roboto@Light"
    id: font_roboto_light_34_text
    size: 34
    bpp: 4
    glyphs: !include ../../../common/assets/text_glyphs.yaml
    extras:
      - file: "gfonts://Heebo@Light"
        glyphs: !include ../../../common/assets/hebrew_glyphs.yaml

  # Top bar network status icon
  - file: 'https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf'
    id: font_mdi_19_network
    size: 19
    bpp: 4
    glyphs: !include ../../../common/assets/network_status_glyphs.yaml

  # Setup screen icons (61px, matches 4848S040)
  - file: 'https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf'
    id: font_mdi_61_setup_icons
    size: 61
    bpp: 4
    glyphs:
      - "\U000F05A9"  # mdi-wifi
      - "\U000F0200"  # mdi-ethernet
      - "\U000F0493"  # mdi-cog
      - "\U000F07D0"  # mdi-home-assistant
